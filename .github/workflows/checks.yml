name: Core and clipboard checks
on: [push, pull_request]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_two_nodes.py
      - if: runner.os == 'macOS'
        run: |
          c++ -std=c++17 -I native/engine/wheel tests/native/mac_wheel_delta.cpp -framework ApplicationServices -o "$RUNNER_TEMP/mac-wheel-delta"
          "$RUNNER_TEMP/mac-wheel-delta"
